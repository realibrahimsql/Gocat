name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  pull_request:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**', '.gitignore']
  workflow_dispatch:

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Test (${{ matrix.os }} / Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - run: go vet ./...

      - name: Check formatting
        if: runner.os != 'Windows'
        shell: bash
        run: |
          UNFMT=$(gofmt -s -l $(git ls-files '*.go'))
          echo "unformatted bytes: ${#UNFMT}"
          printf '[%s]\n' "$UNFMT"
          test -z "$UNFMT"

      - name: Run tests
        shell: bash
        run: go test -timeout=600s ./...

      - name: Smoke test binary
        shell: bash
        run: |
          BIN="./gocat-smoke"
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="./gocat-smoke.exe"; fi
          go build -o "$BIN" .
          "$BIN" --help >/dev/null
          "$BIN" version
          for cmd in benchmark broker chat completion connect console convert doctor dns-tunnel interfaces listen mcp metrics multi-listen payload portforward proxy scan script serve session sniffer stabilize transfer tunnel unix verify version websocket; do
            "$BIN" "$cmd" --help >/dev/null
          done

  race:
    name: Race detector (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - run: go test -race -timeout=600s ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m

  cross-compile:
    name: Compile (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: freebsd, goarch: amd64}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o /dev/null .
